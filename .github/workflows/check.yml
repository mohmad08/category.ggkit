name: Проверка тренажёра

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ... шаги для проверки кода остаются без изменений ...

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted  # <-- ИЗМЕНЕНО
    environment: production

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      # Никаких SSH и настройки known_hosts! Просто выполняем команды.
      - name: Git pull и перезапуск Docker Compose
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          cd "${DEPLOY_PATH}"
          git pull --ff-only origin main
          docker compose up -d --build --remove-orphans
