  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production

    steps:
      - name: Обновить код и перезапустить контейнер
        run: |
          cd /home/hrvision/category.ggkit
          git pull --ff-only origin main
          docker compose up -d --build --remove-orphans
          docker compose logs --tail=30 python-app
